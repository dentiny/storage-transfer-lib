[package]
name = "storage-transfer-lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Bounded bucket-to-bucket transfers using Apache OpenDAL"
repository = "https://github.com/dentiny/storage-transfer-lib"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
opendal = { version = "0.59.5", default-features = false, features = ["executors-tokio", "http-transport-reqwest-rustls", "services-s3", "layers-retry", "layers-timeout"] }
tokio = { version = "1.53.3", features = ["sync", "macros", "rt", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.53.3", features = ["macros", "rt", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
